{% extends "base.html" %}

{% block title %}Remove Schedule Share{% endblock %}

{% block content %}
<h1>Remove Schedule Share</h1>
<p>Are you sure you want to remove the share for <strong>{{ object.schedule.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Remove</button>
    <a href="{% url 'schedules:schedule-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
